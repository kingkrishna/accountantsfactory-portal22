<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://use.fontawesome.com/releases/v5.8.1/css/all.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style-v2.css?v=8" />
  <title>Contact Us - AccountantsFactory</title>
  <meta name="description" content="Contact AccountantsFactory for company registration, GST, compliance, and accounting services in India.">
</head>

<body>
<div id="header-container"></div>
<div id="mobilemenu-container"></div>

<div class="container-fluid sub-footer">
  <br><br><br>
  <div class="row">
    <div class="col-12">
      <h2 id="desktopBannerheading">Contact Us <br/> </h2>
    </div>
  </div>
  <br><br><br>
</div>

<div class="whychooseus">
  <div class="container-fluid py-5">
    <div class="container">
      <div style="margin-bottom: 20px; font-size: 19px; line-height: 1.8;">
        <a href="tel:+919885988540" style="text-decoration: none; color: inherit; display: flex; align-items: center; margin-bottom: 10px;">
          <i class="fas fa-mobile" style="color: #0c9782; margin-right: 8px;"></i> +91 9885988540
        </a>
        <a href="mailto:reachus@accountantsfactory.com" style="text-decoration: none; color: inherit; display: flex; align-items: center;">
          <i class="fas fa-envelope" style="color: #0c9782; margin-right: 8px;"></i> reachus@accountantsfactory.com
        </a>
      </div>

      <div class="row g-4">
        <!-- Address and Map -->
        <div class="col-lg-6">
          <div class="h-100 border rounded shadow-sm overflow-hidden p-3">
            <h5 class="mb-2">Our Address</h5>
            <p style="font-size: 16px; color: #333; line-height: 1.6;">
              2nd Floor, 19-8-114/A1, Kora Towers,<br>
              Air Bypass Rd, next to Maya Bazar,<br>
              Near Annamayya Circle, Bairagi Patteda,<br>
              Tirupati, Andhra Pradesh 517501
            </p>
            <div style="border-radius: 10px; overflow: hidden;">
              <iframe 
                src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d15510.319204025669!2d79.4196063!3d13.6224565!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a4d4b4ab83eb821%3A0x6787397707982971!2sAccountants%20Factory%20LLP!5e0!3m2!1sen!2sin!4v1733728466545!5m2!1sen!2sin" 
                width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy">
              </iframe>
            </div>
          </div>
        </div>

        <!-- Contact Form -->
        <div class="col-lg-6">
          <div class="contact-form">
            <h4 class="text-center">Get in Touch</h4>
            <form id="contactForm">
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="contact" class="form-label">Contact Number</label>
                <input type="tel" id="contact" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Business Email</label>
                <input type="email" id="email" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="service" class="form-label">Service Required</label>
                <select id="service" class="form-select w-100" required>
                  <option disabled selected>Choose a service...</option>
                  <option>Virtual CFO Services</option>
                  <option>Business Advisory Services</option>
                  <option>Management Consulting Services</option>
                  <option>Accounting and Financial Reporting</option>
                  <option>Bookkeeping Services</option>
                  <option>Start-up India Registration Services</option>
                  <option>Tax Filing Services</option>
                  <option>GST Filing Services</option>
                  <option>Payroll and Employee Benefit Services</option>
                  <option>Business Compliance and Regulatory Services</option>
                  <option>Wealth Management Services</option>
                  <option>MCA Annual Return Filing Services</option>
                  <option>Sole Proprietorship</option>
                  <option>Partnership Firm</option>
                  <option>One Person Company</option>
                  <option>Other Services</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" class="form-control" rows="4"></textarea>
              </div>
              <div class="text-right">
                <button type="submit" class="btn btn-primary">Send Now</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="footer-container"></div>

<!-- JS Dependencies -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
<script src="js/components.js?v=8"></script>
<script src="js/forms.js"></script>
<script src="js/scripts.js"></script>
</body>
</html>
