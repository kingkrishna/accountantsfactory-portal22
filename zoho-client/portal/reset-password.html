<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - AccountantsFactory</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://use.fontawesome.com/releases/5.8.1/css/all.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style-v2.css?v=7">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>
  <div id="header-container"></div>

  <div class="container-fluid portal-login-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="login-card glass-effect">
            <div class="login-header">
              <h2><i class="fas fa-lock"></i> Reset Password</h2>
              <p>Enter your new password</p>
            </div>
            
            <div id="reset-error" class="alert alert-danger" style="display: none;"></div>
            <div id="reset-success" class="alert alert-success" style="display: none;"></div>
            
            <form id="reset-password-form">
              <input type="hidden" id="reset-token" name="token">
              
              <div class="form-group">
                <label for="new-password">New Password <span class="text-danger">*</span></label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="fas fa-key"></i></span>
                  </div>
                  <input type="password" class="form-control" id="new-password" name="newPassword" required placeholder="Enter new password">
                  <div class="input-group-append">
                    <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>
                <small class="form-text text-muted">
                  Password must be at least 8 characters and contain uppercase, lowercase, number, and special character (@$!%*?&)
                </small>
              </div>
              
              <div class="form-group">
                <label for="confirm-password">Confirm Password <span class="text-danger">*</span></label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="fas fa-key"></i></span>
                  </div>
                  <input type="password" class="form-control" id="confirm-password" name="confirmPassword" required placeholder="Confirm new password">
                </div>
              </div>
              
              <button type="submit" class="btn btn-primary btn-block btn-login">
                <i class="fas fa-check"></i> Reset Password
              </button>
              
              <div class="text-center mt-3">
                <a href="login.html" class="text-muted small">
                  <i class="fas fa-arrow-left"></i> Back to Login
                </a>
              </div>
            </form>
            
            <div class="login-footer text-center">
              <p class="text-muted small">
                <a href="../index.html" id="back-to-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
  <script src="../../js/components.js?v=8"></script>
  <!-- Set API base URL for production (uncomment and update for deployment) -->
  <!-- <script>window.API_BASE_URL = 'https://api.yourdomain.com/api';</script> -->
  <script src="js/api-url.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
