<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login - AccountantsFactory</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://use.fontawesome.com/releases/5.8.1/css/all.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style-v2.css?v=7">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>
  <div id="header-container"></div>

  <div class="container-fluid portal-login-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="login-card glass-effect">
            <div class="login-header">
              <h2><i class="fas fa-lock"></i> Portal Login</h2>
              <p>Secure access for clients and administrators</p>
            </div>
            
            <div id="login-error" class="alert alert-danger" style="display: none;"></div>

            <div id="login-2fa-step" style="display: none;">
              <p class="text-muted small mb-3">Enter the 6-digit code from your authenticator app.</p>
              <form id="login-2fa-form">
                <div class="form-group">
                <label for="totp-code">Authentication code <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="totp-code" name="code" placeholder="000000" maxlength="8" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" aria-label="6-digit authenticator code">
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-login">
                  <i class="fas fa-check"></i> Verify
                </button>
                <button type="button" class="btn btn-link btn-block mt-2" id="login-2fa-back">← Back to login</button>
              </form>
            </div>
            
            <form id="login-form">
              <div class="form-group">
                <label for="email">Email Address <span class="text-danger">*</span></label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                  </div>
                  <input type="email" class="form-control" id="email" name="email" required placeholder="your.email@example.com">
                </div>
              </div>
              
              <div class="form-group">
                <label for="password">Password <span class="text-danger">*</span></label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="fas fa-key"></i></span>
                  </div>
                  <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
                  <div class="input-group-append">
                    <button class="btn btn-outline-secondary" type="button" id="toggle-password" aria-label="Toggle password visibility">
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>
              </div>
              
              <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="remember-me">
                <label class="form-check-label" for="remember-me">Remember me</label>
              </div>
              
              <button type="submit" class="btn btn-primary btn-block btn-login">
                <i class="fas fa-sign-in-alt"></i> Login
              </button>
              
              <div class="text-center mt-3">
                <a href="#" id="forgot-password-link" class="text-muted small">Forgot Password?</a>
              </div>
            </form>
            
            <div class="login-footer text-center">
              <p class="text-muted small">
                <a href="../index.html" id="back-to-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
  <script src="../../js/components.js?v=8"></script>
  <!-- Set API base URL for production (uncomment and update for deployment) -->
  <!-- <script>window.API_BASE_URL = 'https://api.yourdomain.com/api';</script> -->
  <script src="js/api-url.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
