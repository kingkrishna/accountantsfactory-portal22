name: Keep AppSail Warm

# Pings the AppSail /api/health every 5 minutes so the Catalyst Development
# environment never goes to sleep. This eliminates the "Server is starting"
# cold-start delay that users hit on first request after idle.
# Free: GitHub Actions free tier includes 2,000 minutes/month — this uses ~10.

on:
  schedule:
    # Every 3 minutes (GitHub cron is best-effort; at 3 min we reliably
    # ping at least every ~10 minutes in practice, which keeps AppSail warm).
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/health
        run: |
          set -e
          URL="https://accountantsfactory-api-50040008732.development.catalystappsail.in/api/health"
          echo "Pinging $URL"
          # Retry up to 6 times (30s total) — cold start can take up to ~30s
          for i in 1 2 3 4 5 6; do
            response=$(curl -s -m 20 -w "\n%{http_code}" "$URL" || echo "NETFAIL")
            body=$(echo "$response" | head -n1)
            code=$(echo "$response" | tail -n1)
            echo "Attempt $i: HTTP $code, body: $body"
            if echo "$body" | grep -q '"status":"OK"'; then
              echo "SUCCESS — server warm"
              exit 0
            fi
            sleep 5
          done
          echo "WARNING: server did not respond OK after 6 attempts"
          # Don't fail the workflow — transient issues shouldn't spam alerts
          exit 0

      - name: Log /api/status (token/DB/email health)
        run: |
          curl -s -m 20 "https://accountantsfactory-api-50040008732.development.catalystappsail.in/api/status" || true
