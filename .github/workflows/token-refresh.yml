name: Daily Token Refresh

# Pings the backend's token-refresh endpoint daily to keep the Zoho refresh
# token "warm" (Zoho revokes tokens unused for 90 days). This also early-detects
# token failure 7 days before it would impact users.

on:
  schedule:
    # Run daily at 03:00 IST (21:30 UTC) when traffic is lowest
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger token refresh on backend
        run: |
          set -e
          URL="https://accountantsfactory-api-50040008732.development.catalystappsail.in/api/__token-keepalive"
          echo "Pinging $URL"
          # Retry up to 5 times to handle cold-start
          for i in 1 2 3 4 5; do
            response=$(curl -s -m 30 -w "\n%{http_code}" "$URL" || echo "NETFAIL")
            body=$(echo "$response" | head -n1)
            code=$(echo "$response" | tail -n1)
            echo "Attempt $i: HTTP $code, body: $body"
            if [ "$code" = "200" ]; then
              echo "Token refresh succeeded"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Token refresh failed after 5 attempts — Zoho token may be expired/revoked"
          exit 1
