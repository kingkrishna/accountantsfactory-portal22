name: AccountantsFactory CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: accountantsfactory_test
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: api/package-lock.json

    - name: Install dependencies
      run: |
        cd api
        npm install

    - name: Run Prisma Generate
      run: |
        cd api
        npx prisma generate

    - name: Run Tests
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/accountantsfactory_test
        JWT_SECRET: testing_secret
      run: |
        cd api
        npm test
