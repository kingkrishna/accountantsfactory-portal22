services:
  - type: web
    name: accountantsfactory-portal
    env: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: accountantsfactory-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.zoho.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: accountantsfactory-db
    plan: free

